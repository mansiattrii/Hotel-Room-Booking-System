# Serve HTTPS with a Let's Encrypt certificate (deploy/DEPLOY.md, optional HTTPS section):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.https.yml up -d --wait

services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

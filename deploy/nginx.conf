# Docker's embedded DNS. Without re-resolving, nginx keeps the api container's IP from
# its own startup and returns 502 once the api container is recreated with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://api;

        # Reuse upstream connections (needs HTTP/1.1 and an empty Connection header).
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

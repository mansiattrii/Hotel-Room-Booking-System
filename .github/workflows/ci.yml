name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: hotel_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel_booking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values for a throwaway database; nothing here is a real secret.
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://hotel:ci-only-password@127.0.0.1:5432/hotel_booking_test
      TEST_DATABASE_URL: postgresql+psycopg://hotel:ci-only-password@127.0.0.1:5432/hotel_booking_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag hotel-booking:ci .
      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm hotel-booking:ci id -u)" != "0"
      - name: Check the application imports inside the image
        run: >-
          docker run --rm
          -e DATABASE_URL=postgresql+psycopg://unused:unused@127.0.0.1:5432/unused
          -e JWT_SECRET=ci-only-jwt-secret-not-used-anywhere-else
          hotel-booking:ci python -c "import app.main, app.worker, scripts.seed"
